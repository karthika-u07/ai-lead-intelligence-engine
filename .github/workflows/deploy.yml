name: CI + CD Pipeline (Kubernetes)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: karthikakutty/ai-leads

jobs:

  # ================= CI ================= #
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: ai_lead_enrichment.settings
      TAVILY_API_KEY: test
      GROQ_API_KEY: test
      EMAIL_HOST_USER: test@test.com
      REPORT_RECIPIENT: test@test.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Migrations
        run: |
          python manage.py migrate

      - name: Run Tests
        run: |
          pytest --cov=leads --maxfail=1 -q


  # ================= CD ================= #
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Create IMAGE TAG
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      #  Login DockerHub
      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build Image
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${IMAGE_TAG} -t $IMAGE_NAME:latest .

      #  Push Image
      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${IMAGE_TAG}
          docker push $IMAGE_NAME:latest

      # Deploy to Kubernetes
      - name: Deploy to EC2 (K8s)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ai-lead-intelligence-engine

            kubectl apply -f k8s/

            # IMPORTANT: update image dynamically
            kubectl set image deployment/django-app django=$IMAGE_NAME:${IMAGE_TAG}
            kubectl set image deployment/celery-worker worker=$IMAGE_NAME:${IMAGE_TAG}

            #  restart
            kubectl rollout restart deployment django-app
            kubectl rollout restart deployment celery-worker

            # check rollout
            kubectl rollout status deployment django-app
            kubectl rollout status deployment celery-worker

            #  debug
            kubectl get pods