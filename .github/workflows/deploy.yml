name: CI + CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ---------------- CI JOB ---------------- #
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: ai_lead_enrichment.settings
      TAVILY_API_KEY: test
      GROQ_API_KEY: test
      EMAIL_HOST_USER: test@test.com
      REPORT_RECIPIENT: test@test.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run Migrations
        run: |
          python manage.py migrate

      - name: Run Tests
        run: pytest --cov=leads --maxfail=1 --disable-warnings -q

  # ---------------- CD JOB ---------------- #
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            cd ai-lead-intelligence-engine
            git pull
            docker-compose down
            docker-compose up -d --build