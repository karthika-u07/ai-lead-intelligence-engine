name: CI + CD Pipeline (Kubernetes)

on:
  push:
    branches:
      - main
jobs:
  # ================= CI (TESTING) ================= #
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: ai_lead_enrichment.settings
      TAVILY_API_KEY: test
      GROQ_API_KEY: test
      EMAIL_HOST_USER: test@test.com
      REPORT_RECIPIENT: test@test.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run Migrations
        run: |
          python manage.py migrate

      - name: Run Tests
        run: |
          pytest --cov=leads --maxfail=1 --disable-warnings -q


  # ================= CD (DEPLOYMENT) ================= #
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      #  Login to DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      #  Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t karthikakutty/ai-leads:latest .

      #  Push Docker Image
      - name: Push Docker Image
        run: |
          docker push karthikakutty/ai-leads:latest

      # Deploy to EC2 (Kubernetes)
      - name: Deploy to Kubernetes via EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ai-lead-intelligence-engine
            git pull
  
            # Apply Kubernetes configs
            kubectl apply -f k8s/
  
            # Restart deployments to pull new image
            kubectl rollout restart deployment django-app
            kubectl rollout restart deployment celery-worker
  
            # Check rollout status
            kubectl rollout status deployment django-app