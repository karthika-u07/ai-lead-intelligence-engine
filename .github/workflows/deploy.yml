name: CI + CD Pipeline (Hybrid)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: karthikakutty/ai-leads

jobs:

  # ================= CI ================= #
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: ai_lead_enrichment.settings
      TAVILY_API_KEY: test
      GROQ_API_KEY: test
      EMAIL_HOST_USER: test@test.com
      REPORT_RECIPIENT: test@test.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Tests
        run: pytest --cov=leads --maxfail=1 -q

  # ================= BUILD ================= #
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME:${IMAGE_TAG} -t $IMAGE_NAME:latest .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${IMAGE_TAG}
          docker push $IMAGE_NAME:latest

  # ================= k8s VALIDATION ================= #
  k8s-check:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: sudo snap install kubectl --classic

      - name: Validate Kubernetes YAML
        run: kubectl kustomize k8s/ > /dev/null

  # ================= DEPLOY ================= #
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 (Docker Compose)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ai-lead-intelligence-engine
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            docker ps